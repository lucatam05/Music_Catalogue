name: Publish NuGet

on:
  push:
    tags: [ "v*" ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'
          
      - name: Restore
        run: dotnet restore Music.Catalogue.ClientHttp/Music.Catalogue.ClientHttp.csproj
          
      - name: Pack
        run: dotnet pack Music.Catalogue.ClientHttp/Music.Catalogue.ClientHttp.csproj --configuration Release --no-restore
        
      - name: Push
        run: dotnet nuget push "Music.Catalogue.ClientHttp/bin/Release/*.nupkg" --source "https://nuget.pkg.github.com/lucatam05/index.json" --skip-duplicate --api-key ${{ secrets.NUGET_TOKEN }}
